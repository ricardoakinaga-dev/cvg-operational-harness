# PLAN0374 Fase C (C5) — TLS termination in front of the harness API.
#
# Mounted read-only over /etc/nginx/conf.d/default.conf of the repo `web`
# image (nginx-unprivileged: non-root, pid and temp files under /tmp,
# listens on unprivileged ports; the compose maps 80->8080 and 443->8443).
#
# Trust model: this proxy is the only address in API_TRUSTED_PROXY_ADDRESSES.
# It overwrites X-Forwarded-For/-Proto/-Host and drops any client-supplied
# Forwarded header, so a client cannot assert HTTPS or another IP.

upstream cvg_api {
  server api:3000;
  keepalive 16;
}

# Plain HTTP: no redirect. Requests are forwarded as http so the API answers
# 426 (acceptance of C5: "curl externo sem TLS recebe 426"). Only the ACME
# HTTP-01 challenge is served locally.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto http;
  proxy_set_header Forwarded "";

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
  }

  location = /health/metrics {
    return 404;
  }

  location / {
    proxy_pass http://cvg_api;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:cvg_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Forwarded "";
  proxy_read_timeout 60s;

  # Request metrics are disabled in production by the API (404) and never
  # published at the edge (C7 collects logs and heartbeats instead).
  location = /health/metrics {
    return 404;
  }

  # API: security headers (CSP, HSTS, nosniff...) come from the API itself.
  location /v1/ {
    proxy_pass http://cvg_api;
  }

  location ~ ^/(live|ready|health)$ {
    proxy_pass http://cvg_api;
  }

  # Operator console (static build of apps/web shipped in the same image).
  # Exposing it is a product decision; to serve the API only, replace this
  # block with `return 404;`.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}

# Container healthcheck only (loopback inside the proxy container).
server {
  listen 127.0.0.1:8081;
  server_name _;
  access_log off;

  location = /proxy-health {
    default_type text/plain;
    return 200 "ok\n";
  }
}
