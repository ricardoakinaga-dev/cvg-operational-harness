# Gitleaks configuration (PR-011, docs/03_build/0356_production_backlog_2026-09-26.md).
# Every default rule stays active. Only the generic-api-key heuristic gets
# rule-scoped allowlists, where the 2026-09-26 triage found non-secret values:
# 445 SHA-256 digests in hash-bound audit evidence and synthetic test fixtures
# (the constitution forbids real data in this repository). Specific rules
# such as aws-access-token still fire inside test files. Single historical
# findings are pinned by fingerprint in .gitleaksignore.
title = "cvg-operational-harness"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 digests recorded in hash-bound audit evidence"
condition = "AND"
paths = ['''^docs/04_audit/evidence/''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']

[[rules.allowlists]]
description = "Synthetic fixtures in test files"
paths = [
  '''(^|/)__tests__/[^/]+\.test\.tsx?$''',
  '''(^|/)__tests__/fixtures/[^/]+\.tsx?$''',
  '''^tests/[^/]+\.test\.[jt]s$''',
  '''^tests/e2e/[^/]+\.spec\.ts$'''
]

# A2 (plano 0374), decided by the user on 2026-10-16: path allowlist for the
# generic-api-key heuristic only, limited to the paths whose findings were
# triaged as synthetic ids, markers, prose or .env.example variable names
# (docs/04_audit/evidence/PLAN0374-A-20261007/raw/weekly-secret-scan-triage.json
# and docs/04_audit/evidence/RESOLVE-20261016/). Specific rules (AWS, GitHub,
# private keys, ...) still fire in these paths; generic findings anywhere
# else still fail the scan.
[[rules.allowlists]]
description = "Triaged synthetic values in historical evidence, archives, examples and the smoke script"
paths = [
  '''^docs/04_audit/evidence/(HARNESS-ISO-EXEC-20261003|AUD0590-DEEP-20260928|AUD0591-REPOSITORY-20260930|AUD0593-20261001|AUD0594-20261002|PARE100-EXEC-20261014)/''',
  '''^docs/08_runtime/archive/''',
  '''^docs/08_runtime/handoffs/aud0592_execution_20260930\.md$''',
  '''^\.agent/execution-log\.jsonl$''',
  '''(^|/)\.env\.example$''',
  '''^scripts/production-stack-smoke\.ts$'''
]
