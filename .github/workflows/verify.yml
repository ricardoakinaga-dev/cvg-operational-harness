name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: REM21 CI bar (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cvg_test
      PHASE4A_DISPOSABLE_PG: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cvg_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cvg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The runner context is not available in job-level env (PR-010), so the
      # artifact directory is resolved here and exported to later steps.
      - name: Resolve CI artifact directory
        run: echo "CI_ARTIFACT_DIR=${RUNNER_TEMP}/cvg-ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Runtime version evidence
        run: |
          node --version
          npm --version

      - name: Initialize candidate/run bar
        run: node scripts/ci-bar.mjs init

      - name: Gate install
        run: node scripts/ci-bar.mjs gate install

      - name: Gate readiness
        run: node scripts/ci-bar.mjs gate readiness

      - name: Gate format
        run: node scripts/ci-bar.mjs gate format

      - name: Gate typecheck
        run: node scripts/ci-bar.mjs gate typecheck

      - name: Gate lint
        run: node scripts/ci-bar.mjs gate lint

      - name: Gate build
        run: node scripts/ci-bar.mjs gate build

      - name: Gate unit
        run: node scripts/ci-bar.mjs gate unit

      - name: Gate coverage
        run: node scripts/ci-bar.mjs gate coverage

      - name: Gate web coverage
        run: node scripts/ci-bar.mjs gate coverage-web

      - name: Gate critical coverage
        run: node scripts/ci-bar.mjs gate coverage-critical

      - name: Gate mutation
        run: node scripts/ci-bar.mjs gate mutation

      - name: Gate worker startup
        run: node scripts/ci-bar.mjs gate worker-startup

      - name: Gate PostgreSQL
        run: node scripts/ci-bar.mjs gate postgres

      - name: Gate PostgreSQL adapter coverage
        run: node scripts/ci-bar.mjs gate coverage-postgres

      - name: Gate PostgreSQL backup restore rollback proof
        run: node scripts/ci-bar.mjs gate postgres-proof

      - name: Gate observability exporter and SLO proof
        run: node scripts/ci-bar.mjs gate observability-proof

      - name: Gate phase 2
        run: node scripts/ci-bar.mjs gate phase2

      - name: Gate phase 3
        run: node scripts/ci-bar.mjs gate phase3

      - name: Gate phase 4A
        run: node scripts/ci-bar.mjs gate phase4a

      - name: Gate phase 4A identity
        run: node scripts/ci-bar.mjs gate phase4a-identity

      - name: Gate chaos
        run: node scripts/ci-bar.mjs gate chaos

      - name: Gate evals
        run: node scripts/ci-bar.mjs gate evals

      - name: Gate load
        run: node scripts/ci-bar.mjs gate load

      - name: Gate restore
        run: node scripts/ci-bar.mjs gate restore

      - name: Gate docs and links
        run: node scripts/ci-bar.mjs gate docs

      - name: Install declared browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Gate E2E
        run: node scripts/ci-bar.mjs gate e2e

      - name: Gate REM21-014 trusted browser and accessibility proof
        run: node scripts/ci-bar.mjs gate browser-proof

      - name: Gate skip governance
        run: node scripts/ci-bar.mjs gate skip

      - name: Gate image build and non-root smoke
        run: node scripts/ci-bar.mjs gate image

      - name: Gate SBOM
        run: node scripts/ci-bar.mjs gate sbom

      - name: Gate licenses
        run: node scripts/ci-bar.mjs gate licenses

      - name: Gate security audit
        run: node scripts/ci-bar.mjs gate security

      - name: Gate certification
        run: node scripts/ci-bar.mjs gate certify

      - name: Gate certification verifier
        run: node scripts/ci-bar.mjs gate certification-verify

      - name: Gate diff
        run: node scripts/ci-bar.mjs gate diff

      - name: Gate artifacts and candidate drift
        if: always()
        run: node scripts/ci-bar.mjs gate artifacts

      - name: Finalize CI bar
        if: always()
        run: node scripts/ci-bar.mjs finalize

      - name: Upload CI bar artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cvg-ci-bar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cvg-ci/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
